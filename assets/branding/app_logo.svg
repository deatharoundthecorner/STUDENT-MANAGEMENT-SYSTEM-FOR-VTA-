<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Slate to Executive Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Primary Blue Gradient for Back Folio / Left Page -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Vibrant Check / Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Card Depth -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Tile (Squircle with 110px corner radius) -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Back Folio Layer (Left Page / Folder in Royal Blue) -->
  <path d="M 124 136 C 124 118 138 104 156 104 L 276 104 C 294 104 308 118 308 136 L 308 376 C 308 394 294 408 276 408 L 156 408 C 138 408 124 394 124 376 Z" 
        fill="url(#blueGrad)"/>

  <!-- Left Folio Detail: Subtle Ledger Line Accents -->
  <rect x="156" y="164" width="72" height="14" rx="7" fill="#93C5FD" opacity="0.85"/>
  <rect x="156" y="200" width="112" height="12" rx="6" fill="#BFDBFE" opacity="0.6"/>
  <rect x="156" y="232" width="96" height="12" rx="6" fill="#BFDBFE" opacity="0.6"/>
  <rect x="156" y="264" width="80" height="12" rx="6" fill="#BFDBFE" opacity="0.6"/>

  <!-- Front Student Record Card (Crisp White Card with subtle drop shadow) -->
  <g filter="url(#cardShadow)">
    <path d="M 216 116 C 216 100 229 88 245 88 L 363 88 C 379 88 392 100 392 116 L 392 384 C 392 400 379 412 363 412 L 245 412 C 229 412 216 400 216 384 Z" 
          fill="#FFFFFF"/>
  </g>

  <!-- Front Card Header Banner (Identification Header) -->
  <path d="M 216 116 C 216 100 229 88 245 88 L 363 88 C 379 88 392 100 392 116 L 392 168 L 216 168 Z" 
        fill="#2563EB"/>

  <!-- Student Avatar Silhouette on Front Card Header -->
  <circle cx="304" cy="120" r="16" fill="#FFFFFF"/>
  <path d="M 284 156 C 284 142 292 136 304 136 C 316 136 324 142 324 156 Z" fill="#FFFFFF"/>

  <!-- Front Card Structured Record Lines (Organized Student Data) -->
  <rect x="246" y="196" width="116" height="14" rx="7" fill="#1E293B"/>
  <rect x="246" y="226" width="88" height="12" rx="6" fill="#64748B"/>
  <rect x="246" y="254" width="104" height="12" rx="6" fill="#94A3B8"/>
  <rect x="246" y="282" width="76" height="12" rx="6" fill="#CBD5E1"/>

  <!-- Verification Badge: Circular Emerald/Blue Emblem at Bottom-Right of Card -->
  <circle cx="356" cy="364" r="42" fill="url(#accentGrad)" filter="url(#cardShadow)"/>
  <circle cx="356" cy="364" r="39" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.8"/>
  <!-- Sharp White Verification Checkmark -->
  <path d="M 338 364 L 350 376 L 376 348" 
        fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>